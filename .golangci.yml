version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - gosec
    - errorlint
    - misspell
    - bodyclose
    - unconvert
    - revive
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
    gosec:
      excludes:
        - G115 # integer conversions of small, checked values (ports, uids)
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck, errorlint]
formatters:
  enable:
    - gofmt
    - goimports
